<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo designs · 3D viewer</title>
    <!-- Logo 1: the reachAkash logo in 3D (built from /images/brand/lockup.svg), with Play, views and height.
         Logo 2: the crystal logo. The previous version of this viewer is kept at /pages/archive/logo-viewer-v1.html. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }

        #toggle {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 200;
            display: flex; gap: 0; border-radius: 8px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(12px); background: rgba(0,0,0,0.6);
            font: 600 13px/1 'SF Mono', 'Consolas', monospace;
        }
        #toggle button {
            padding: 10px 22px; border: none; cursor: pointer;
            background: transparent; color: #888; transition: all 0.25s;
            letter-spacing: 0.5px;
        }
        #toggle button.active {
            background: rgba(180, 34, 34, 0.85); color: #fff;
        }
        #toggle button:hover:not(.active) { color: #ccc; background: rgba(255,255,255,0.05); }

        #controls {
            position: absolute; top: 60px; left: 12px; z-index: 100;
            background: rgba(0,0,0,0.75); padding: 14px 16px;
            border-radius: 8px; color: #ccc; font: 12px/1.6 'SF Mono', 'Consolas', monospace;
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
            min-width: 210px; max-width: calc(100vw - 24px);
        }
        #controls label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
        #controls input[type=range] { flex: 1; max-width: 110px; accent-color: #c33; }
        #controls input[type=color] { border: none; background: none; width: 28px; height: 22px; cursor: pointer; }
        #controls .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .val { color: #f66; min-width: 32px; text-align: right; font-size: 11px; }
        #controls h3 { color: #f44; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,60,60,0.2); padding-bottom: 6px; }
        #controls .sub { color: #888; font-size: 11px; margin: 2px 0 4px; }
        #controls .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        #controls button.c {
            font: inherit; color: #ddd; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 5px 10px; cursor: pointer;
        }
        #controls button.c:hover { border-color: #c33; color: #fff; }
        #controls button.play { width: 100%; padding: 8px; font-weight: 700; color: #fff; background: rgba(180,34,34,0.85); border-color: transparent; }

        /* Per-logo controls (id-level selectors so they beat the label/row rules above) */
        #controls .rak-only, #controls .crystal-only { display: none; }
        body.mode-rak #controls .rak-only, body.mode-crystal #controls .crystal-only { display: flex; }
        body.mode-rak #controls .sub.rak-only { display: block; }

        #hint {
            position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 100;
            color: #777; font: 12px 'SF Mono', 'Consolas', monospace; white-space: nowrap;
        }
    </style>
</head>
<body class="mode-rak">

<div id="toggle">
    <button id="btnRak" class="active" type="button">Logo 1</button>
    <button id="btnCrystal" type="button">Logo 2</button>
</div>

<div id="controls">
    <h3>Controls</h3>
    <div class="btns rak-only"><button class="c play" id="play" type="button">&#9654; Play</button></div>
    <div class="sub rak-only">View</div>
    <div class="btns rak-only">
        <button class="c" type="button" data-view="front">Front</button>
        <button class="c" type="button" data-view="back">Back</button>
        <button class="c" type="button" data-view="top">Top</button>
        <button class="c" type="button" data-view="bottom">Bottom</button>
    </div>
    <label class="rak-only">Height <input type="range" id="height" min="-250" max="250" step="1" value="0"> <span class="val" id="heightV">0</span></label>
    <div class="row crystal-only">
        <span>Color</span>
        <input type="color" id="colorPicker" value="#B22222">
    </div>
    <label>Metalness <input type="range" id="metalness" min="0" max="1" step="0.01" value="0.15"> <span class="val" id="metalnessV">0.15</span></label>
    <label>Roughness <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.03"> <span class="val" id="roughnessV">0.03</span></label>
    <label class="crystal-only">Depth <input type="range" id="depth" min="0.3" max="3" step="0.05" value="1.0"> <span class="val" id="depthV">1.00</span></label>
    <label class="crystal-only">Opacity <input type="range" id="opacity" min="0.3" max="1" step="0.01" value="0.88"> <span class="val" id="opacityV">0.88</span></label>
    <label>Speed <input type="range" id="rotSpeed" min="0" max="5" step="0.1" value="1.0"> <span class="val" id="rotSpeedV">1.0</span></label>
</div>

<div id="hint">Drag to turn · scroll to zoom</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const $ = id => document.getElementById(id);
const clamp01 = v => Math.min(1, Math.max(0, v));
const easeOut = p => 1 - Math.pow(1 - p, 4);
const easeInOut = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Shared Scene
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 4000);
camera.position.set(0, 0, 1000);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.localClippingEnabled = true;          // the curve "draws" upward behind a moving clip plane
document.body.appendChild(renderer.domElement);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Lighting
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
scene.add(new THREE.AmbientLight(0xffffff, 0.45));

const lightDefs = [
    { color: 0xffffff, intensity: 3.5, pos: [300, 400, 500] },
    { color: 0x8888ff, intensity: 1.5, pos: [-400, -100, 300] },
    { color: 0xff4422, intensity: 2.0, pos: [0, 0, -500] },
    { color: 0xffddcc, intensity: 2.0, pos: [0, 500, 100] },
    { color: 0xff6633, intensity: 1.5, pos: [-200, -300, 50] },
    { color: 0xffffff, intensity: 1.8, pos: [400, -200, 200] },
];
for (const l of lightDefs) {
    const d = new THREE.DirectionalLight(l.color, l.intensity);
    d.position.set(...l.pos);
    scene.add(d);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Camera controls: drag to turn, scroll to zoom, no panning
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 300;
controls.maxDistance = 2200;
controls.update();


// ╔════════════════════════════════════════════════════════╗
// ║  LOGO 1 — reachAkash, 8 steps and the curve, in 3D     ║
// ╚════════════════════════════════════════════════════════╝
// Same timings as the intro on reachakash.com (ms; rise in logo units).
const INTRO = { stagger: 120, step: 450, rise: 40, curve: 900, popStagger: 90, pop: 350, popScale: 1.08 };
const WHITE = 0xffffff, RED = 0x600000;
const DEFAULT_YAW = -0.35;                       // a three-quarter view, like the 2D logo

const rak = new THREE.Group();                   // spins (Y) and moves up/down (Height)
const rakTilt = new THREE.Group();               // a fixed tilt so the tops of the steps show
rak.add(rakTilt);
scene.add(rak);

const curvePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1e9);   // world-space clip; 1e9 = clip nothing
const rakMats = [];
let steps = [], curveMesh = null, curveTop = 0, curveBottom = 0;

async function buildRak() {
    const text = await (await fetch('/images/brand/lockup.svg')).text();
    const svg = new DOMParser().parseFromString(text, 'image/svg+xml');

    // Each .logo-step's first path is its outline: a box drawn in oblique 3D (front face, top, right side).
    for (const g of svg.querySelectorAll('.logo-step')) {
        const path = g.querySelector('path');
        const red = /logo-ember/.test(path.getAttribute('style') || '');
        const n = path.getAttribute('d').match(/-?[0-9.]+/g).map(Number);
        const P = []; for (let i = 0; i < n.length; i += 2) P.push([n[i], n[i + 1]]);
        const maxY = Math.max(...P.map(q => q[1])), minY = Math.min(...P.map(q => q[1]));
        const near = (a, b) => Math.abs(a - b) < 0.6, byX = (a, b) => a[0] - b[0];
        const [BL, BR] = P.filter(q => near(q[1], maxY)).sort(byX);
        const TRb = P.filter(q => near(q[1], minY)).sort(byX)[1];
        const FTL = P.filter(q => !near(q[1], maxY) && !near(q[1], minY)).sort(byX)[0];
        const w = BR[0] - BL[0], h = BL[1] - FTL[1];
        const depth = Math.hypot(TRb[0] - BR[0], FTL[1] - TRb[1]) * 2.2;
        const mat = new THREE.MeshStandardMaterial({ color: red ? RED : WHITE, metalness: 0.15, roughness: 0.35, transparent: true });
        rakMats.push(mat);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, depth), mat);
        mesh.position.set((BL[0] + BR[0]) / 2, -(BL[1] + FTL[1]) / 2, -depth / 2);
        rakTilt.add(mesh);
        steps.push(mesh);
    }
    steps.sort((a, b) => a.position.y - b.position.y);              // bottom first

    // The curve: the SVG path extruded into a solid. Geometry stays in SVG units (y down); the mesh flips it.
    const d = svg.querySelector('#logo-curve path').getAttribute('d');
    const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`);
    const shapes = data.paths.flatMap(p => SVGLoader.createShapes(p));
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: 28, bevelEnabled: true, bevelThickness: 2, bevelSize: 1.5, bevelSegments: 2, curveSegments: 24 });
    geo.computeBoundingBox();
    curveTop = geo.boundingBox.min.y; curveBottom = geo.boundingBox.max.y;
    const curveMat = new THREE.MeshStandardMaterial({ color: RED, metalness: 0.15, roughness: 0.35, side: THREE.DoubleSide, clippingPlanes: [curvePlane] });
    rakMats.push(curveMat);
    curveMesh = new THREE.Mesh(geo, curveMat);
    curveMesh.scale.y = -1;
    curveMesh.position.z = -50;
    rakTilt.add(curveMesh);

    // Centre on the origin (before tilting), then tilt.
    const box = new THREE.Box3().setFromObject(rakTilt);
    const centre = box.getCenter(new THREE.Vector3());
    for (const m of rakTilt.children) m.position.sub(centre);
    for (const s of steps) s.userData.baseY = s.position.y;
    rakTilt.rotation.x = 0.32;
    rak.scale.setScalar(0.85);
    rak.rotation.y = DEFAULT_YAW;
}

// 0 = curve hidden, 1 = fully drawn; revealed from its bottom end to its top end.
function setCurveReveal(f) {
    if (!curveMesh) return;
    if (f >= 1) { curvePlane.set(new THREE.Vector3(0, 1, 0), 1e9); return; }
    const yCut = curveBottom - f * (curveBottom - curveTop);           // SVG units, y down
    const local = new THREE.Plane(new THREE.Vector3(0, 1, 0), -yCut);   // keep y >= yCut
    curveMesh.updateMatrixWorld(true);
    curvePlane.copy(local).applyMatrix4(curveMesh.matrixWorld);
}

// Pop: 1 -> popScale -> 0.985 -> 1
function popScale(q) {
    if (q <= 0 || q >= 1) return 1;
    const k = [[0, 1], [0.45, INTRO.popScale], [0.75, 0.985], [1, 1]];
    for (let i = 1; i < k.length; i++) {
        if (q <= k[i][0]) {
            const u = (q - k[i - 1][0]) / (k[i][0] - k[i - 1][0]), s = u * u * (3 - 2 * u);
            return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * s;
        }
    }
    return 1;
}

// Intro at time t (ms): steps build bottom to top, the curve draws upward, then each step pops.
function introAt(t) {
    const n = steps.length;
    const curveStart = (n - 1) * INTRO.stagger + INTRO.step, popStart = curveStart + INTRO.curve;
    steps.forEach((s, i) => {
        const e = easeOut(clamp01((t - i * INTRO.stagger) / INTRO.step));
        s.material.opacity = e;
        s.position.y = s.userData.baseY - (1 - e) * INTRO.rise;
        s.scale.setScalar(popScale(clamp01((t - popStart - i * INTRO.popStagger) / INTRO.pop)));
    });
    setCurveReveal(easeInOut(clamp01((t - curveStart) / INTRO.curve)));
    return popStart + (n - 1) * INTRO.popStagger + INTRO.pop;           // total length
}

let playStart = -1, spinBeforePlay = 1;
function play() {
    if (!steps.length) return;
    if (playStart < 0) spinBeforePlay = rotSpeed;
    setSpin(0);
    rak.rotation.y = DEFAULT_YAW;
    playStart = performance.now();
}


// ╔════════════════════════════════════════════════════════╗
// ║  LOGO 2 — 3-CRYSTAL OCTAHEDRON                        ║
// ╚════════════════════════════════════════════════════════╝

const MX = 245, EQ_Y = 310;

const L = { topX: 177, topY: 60, botX: 238, botY: 422, eqL: 103, eqR: 166 };
L.eqMidX = (L.eqL + L.eqR) / 2;
L.baseHalfZ = (L.eqR - L.eqL) / 2;

const C = { topX: 246, topY: 73, botX: 246, botY: 422, eqL: 212, eqR: 278 };
C.baseHalfZ = (C.eqR - C.eqL) / 2;

const R = {
    topX: 2*MX - L.topX, topY: L.topY, botX: 2*MX - L.botX, botY: L.botY,
    eqL: 2*MX - L.eqR, eqR: 2*MX - L.eqL
};
R.eqMidX = (R.eqL + R.eqR) / 2;
R.baseHalfZ = L.baseHalfZ;

function buildOctahedron(top, bot, eq0, eq1, eq2, eq3) {
    const v = [];
    const push = (a,b,c) => v.push(...a,...b,...c);
    push(top,eq0,eq1); push(top,eq1,eq2); push(top,eq2,eq3); push(top,eq3,eq0);
    push(bot,eq1,eq0); push(bot,eq2,eq1); push(bot,eq3,eq2); push(bot,eq0,eq3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
    geo.computeVertexNormals();
    return geo;
}

const crystalMat = new THREE.MeshPhysicalMaterial({
    color: 0xB22222, emissive: 0x220404, emissiveIntensity: 0.6,
    metalness: 0.15, roughness: 0.03, clearcoat: 1.0, clearcoatRoughness: 0.04,
    reflectivity: 1.0, transparent: true, opacity: 0.88,
    flatShading: true, side: THREE.DoubleSide, depthWrite: true,
});

const crystalGroup = new THREE.Group();
scene.add(crystalGroup);

let depthScale = 1.0;
function sy(y) { return -y; }

function rebuildCrystal() {
    while (crystalGroup.children.length) {
        crystalGroup.children[0].geometry.dispose();
        crystalGroup.remove(crystalGroup.children[0]);
    }
    const ds = depthScale;

    // Left
    crystalGroup.add(new THREE.Mesh(buildOctahedron(
        [L.topX, sy(L.topY), 0], [L.botX, sy(L.botY), 0],
        [L.eqL, sy(EQ_Y), 0], [L.eqMidX, sy(EQ_Y), L.baseHalfZ*ds],
        [L.eqR, sy(EQ_Y), 0], [L.eqMidX, sy(EQ_Y), -L.baseHalfZ*ds]
    ), crystalMat));

    // Center (45° rotated — edge forward)
    const cHZ = C.baseHalfZ * ds;
    const cMidX = (C.eqL + C.eqR) / 2;
    const cHX = (C.eqR - C.eqL) / 2;
    crystalGroup.add(new THREE.Mesh(buildOctahedron(
        [C.topX, sy(C.topY), 0], [C.botX, sy(C.botY), 0],
        [cMidX, sy(EQ_Y), cHZ], [cMidX+cHX, sy(EQ_Y), 0],
        [cMidX, sy(EQ_Y), -cHZ], [cMidX-cHX, sy(EQ_Y), 0]
    ), crystalMat));

    // Right (mirror)
    crystalGroup.add(new THREE.Mesh(buildOctahedron(
        [R.topX, sy(R.topY), 0], [R.botX, sy(R.botY), 0],
        [R.eqR, sy(EQ_Y), 0], [R.eqMidX, sy(EQ_Y), R.baseHalfZ*ds],
        [R.eqL, sy(EQ_Y), 0], [R.eqMidX, sy(EQ_Y), -R.baseHalfZ*ds]
    ), crystalMat));

    // Centre at the world origin
    const box = new THREE.Box3().setFromObject(crystalGroup);
    const cen = box.getCenter(new THREE.Vector3());
    for (const mesh of crystalGroup.children) mesh.position.sub(cen);
    crystalGroup.position.set(0, 0, 0);
    crystalGroup.scale.set(1, 1, 1);
}
rebuildCrystal();


// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Logo switch
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setMode(mode) {
    rak.visible = mode === 'rak';
    crystalGroup.visible = mode === 'crystal';
    $('btnRak').classList.toggle('active', mode === 'rak');
    $('btnCrystal').classList.toggle('active', mode === 'crystal');
    document.body.className = 'mode-' + mode;
}
$('btnRak').onclick = () => setMode('rak');
$('btnCrystal').onclick = () => setMode('crystal');
setMode('rak');


// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Views: swing the camera round the logo (front, back, top, bottom)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// "Front" reuses the idle pose's camera/object relationship (proven to frame the mark well,
// since it's what plays on load) rather than an arbitrary world angle; the others are relative to it.
const VIEW_YAW = -DEFAULT_YAW;
const VIEWS = {
    front:  { theta: VIEW_YAW,              phi: Math.PI / 2 },
    back:   { theta: VIEW_YAW + Math.PI,    phi: Math.PI / 2 },
    top:    { theta: VIEW_YAW,              phi: 0.02 },
    bottom: { theta: VIEW_YAW,              phi: Math.PI - 0.02 },
};
let camTween = null;
function goView(name) {
    setSpin(0);
    rak.rotation.y = 0;
    crystalGroup.rotation.y = 0;
    const from = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const v = VIEWS[name];
    let dTheta = v.theta - from.theta;
    dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));            // shortest way round
    camTween = { from, to: { radius: from.radius, phi: v.phi, theta: from.theta + dTheta }, t0: performance.now(), dur: 800 };
}
document.querySelectorAll('[data-view]').forEach(b => { b.onclick = () => goView(b.dataset.view); });


// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI wiring
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('play').onclick = play;

$('height').oninput = e => {
    rak.position.y = +e.target.value;
    $('heightV').textContent = e.target.value;
};

$('colorPicker').oninput = e => crystalMat.color.set(new THREE.Color(e.target.value));

$('metalness').oninput = e => {
    const v = +e.target.value;
    crystalMat.metalness = v;
    rakMats.forEach(m => { m.metalness = v; });
    $('metalnessV').textContent = v.toFixed(2);
};

$('roughness').oninput = e => {
    const v = +e.target.value;
    crystalMat.roughness = v;
    rakMats.forEach(m => { m.roughness = Math.max(v, 0.2); });
    $('roughnessV').textContent = v.toFixed(2);
};

$('depth').oninput = e => {
    depthScale = +e.target.value;
    $('depthV').textContent = depthScale.toFixed(2);
    rebuildCrystal();
};

$('opacity').oninput = e => {
    crystalMat.opacity = +e.target.value;
    $('opacityV').textContent = (+e.target.value).toFixed(2);
};

let rotSpeed = 1.0;
function setSpin(v) {
    rotSpeed = v;
    $('rotSpeed').value = v;
    $('rotSpeedV').textContent = (+v).toFixed(1);
}
$('rotSpeed').oninput = e => setSpin(+e.target.value);


// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Render
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();

    if (camTween) {
        const k = clamp01((now - camTween.t0) / camTween.dur), e = easeInOut(k);
        const s = new THREE.Spherical(
            camTween.from.radius + (camTween.to.radius - camTween.from.radius) * e,
            camTween.from.phi + (camTween.to.phi - camTween.from.phi) * e,
            camTween.from.theta + (camTween.to.theta - camTween.from.theta) * e
        );
        camera.position.setFromSpherical(s).add(controls.target);
        camera.lookAt(controls.target);
        if (k === 1) camTween = null;
    } else {
        controls.update();
    }

    if (playStart >= 0) {
        const total = introAt(now - playStart);
        if (now - playStart >= total) { introAt(1e9); playStart = -1; setSpin(spinBeforePlay); }
    }

    // Spin both logos around their own vertical axis
    const delta = rotSpeed * 0.01, TAU = Math.PI * 2;
    rak.rotation.y += delta;
    crystalGroup.rotation.y += delta;
    if (rak.rotation.y > TAU) rak.rotation.y -= TAU;
    if (crystalGroup.rotation.y > TAU) crystalGroup.rotation.y -= TAU;

    renderer.render(scene, camera);
}
animate();

buildRak().then(() => {
    if (reducedMotion) setSpin(0);
    else play();
}).catch(err => { $('hint').textContent = 'Could not load the logo: ' + err.message; });

// Testing hooks: play from code, or freeze the intro at a moment (ms).
window.logoViewer = { play, goView, setMode, introAt: t => { playStart = -1; setSpin(0); rak.rotation.y = DEFAULT_YAW; introAt(t); } };

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
